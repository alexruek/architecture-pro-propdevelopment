apiVersion: v1
kind: Pod
metadata:
  name: pod-secure-02
  namespace: audit-zone
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nginx
      image: nginx:1.25
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: app-data
          mountPath: /data
  volumes:
    - name: app-data
      emptyDir: {}
